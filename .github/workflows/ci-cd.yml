# Generated by python3 deploy/generate_workflow.py.
name: MCP CI and production deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to rebuild and deploy with current Secrets
        required: true
        type: choice
        default: all
        options:
          - all
          - db-gateway
          - signoz-mcp
          - source-mcp
          - github-mcp
          - docs-tool-service
          - notification-service
          - zendesk-mcp
          - zendesk-browser-relay

permissions:
  contents: read
concurrency:
  group: mcp-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      services: ${{ steps.select.outputs.services }}
      changed: ${{ steps.select.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/select_services.py

  verify-deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test deployment validation and rollback
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Check generated workflow is current
        run: |
          python3 deploy/generate_workflow.py
          git diff --exit-code -- .github/workflows/ci-cd.yml

  build:
    needs: [plan, verify-deployer]
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: ghcr.io/david-yang-pixel/mcp-plugins/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.10.7'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: ${{ matrix.service }}
      - name: Locked dependencies and service tests
        working-directory: ${{ matrix.service }}
        run: |
          uv sync --locked --all-extras --all-groups
          uv run --locked pytest -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image without production credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./${{ matrix.service }}
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/david-yang-pixel/mcp-plugins
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Verify packaged service and authentication
        run: python3 deploy/smoke_image.py "$SERVICE" "$IMAGE"
      - name: Publish private image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io

  deploy:
    needs: [plan, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      REVISION: ${{ github.sha }}
      DEPLOY_HOST: ${{ vars.MCP_DEPLOY_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.MCP_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ vars.MCP_DEPLOY_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY_TOKEN: ${{ github.token }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Authenticate to private image registry
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Deploy db-gateway and verify
        if: matrix.service == 'db-gateway'
        env:
          SECRET_DB_GATEWAY_API_KEY: ${{ secrets.MCP_DB_GATEWAY__DB_GATEWAY_API_KEY }}
          SECRET_FEISHU_WEBHOOK_SECRET: ${{ secrets.MCP_DB_GATEWAY__FEISHU_WEBHOOK_SECRET }}
          SECRET_FEISHU_WEBHOOK_URL: ${{ secrets.MCP_DB_GATEWAY__FEISHU_WEBHOOK_URL }}
          SECRET_INTERNAL_SHARED_SECRET: ${{ secrets.MCP_DB_GATEWAY__INTERNAL_SHARED_SECRET }}
          SECRET_PG_PASSWORD: ${{ secrets.MCP_DB_GATEWAY__PG_PASSWORD }}
          SECRET_TELEPORT_PASSWORD: ${{ secrets.MCP_DB_GATEWAY__TELEPORT_PASSWORD }}
          SECRET_TELEPORT_TOTP_SECRET: ${{ secrets.MCP_DB_GATEWAY__TELEPORT_TOTP_SECRET }}
          SECRET_TELEPORT_USER: ${{ secrets.MCP_DB_GATEWAY__TELEPORT_USER }}
        run: python3 deploy/client.py
      - name: Deploy signoz-mcp and verify
        if: matrix.service == 'signoz-mcp'
        env:
          SECRET_SIGNOZ_API_KEY: ${{ secrets.MCP_SIGNOZ_MCP__SIGNOZ_API_KEY }}
          SECRET_SIGNOZ_MCP_API_KEY: ${{ secrets.MCP_SIGNOZ_MCP__SIGNOZ_MCP_API_KEY }}
        run: python3 deploy/client.py
      - name: Deploy source-mcp and verify
        if: matrix.service == 'source-mcp'
        env:
          SECRET_SOURCE_MCP_API_KEY: ${{ secrets.MCP_SOURCE_MCP__SOURCE_MCP_API_KEY }}
          SECRET_SOURCE_MCP_GITHUB_TOKEN: ${{ secrets.MCP_SOURCE_MCP__SOURCE_MCP_GITHUB_TOKEN }}
          SECRET_SOURCE_MCP_SIGNOZ_MCP_API_KEY: ${{ secrets.MCP_SOURCE_MCP__SOURCE_MCP_SIGNOZ_MCP_API_KEY }}
        run: python3 deploy/client.py
      - name: Deploy github-mcp and verify
        if: matrix.service == 'github-mcp'
        env:
          SECRET_GITHUB_MCP_API_KEY: ${{ secrets.MCP_GITHUB_MCP__GITHUB_MCP_API_KEY }}
          SECRET_GITHUB_MCP_GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_MCP__GITHUB_MCP_GITHUB_TOKEN }}
        run: python3 deploy/client.py
      - name: Deploy docs-tool-service and verify
        if: matrix.service == 'docs-tool-service'
        env:
          SECRET_DOCS_TOOL_SERVICE_API_KEY: ${{ secrets.MCP_DOCS_TOOL_SERVICE__DOCS_TOOL_SERVICE_API_KEY }}
        run: python3 deploy/client.py
      - name: Deploy notification-service and verify
        if: matrix.service == 'notification-service'
        env:
          SECRET_FEISHU_WEBHOOK_SECRET: ${{ secrets.MCP_NOTIFICATION_SERVICE__FEISHU_WEBHOOK_SECRET }}
          SECRET_FEISHU_WEBHOOK_URL: ${{ secrets.MCP_NOTIFICATION_SERVICE__FEISHU_WEBHOOK_URL }}
          SECRET_NOTIFICATION_SERVICE_API_KEY: ${{ secrets.MCP_NOTIFICATION_SERVICE__NOTIFICATION_SERVICE_API_KEY }}
        run: python3 deploy/client.py
      - name: Deploy zendesk-mcp and verify
        if: matrix.service == 'zendesk-mcp'
        env:
          SECRET_ZENDESK_API_TOKEN: ${{ secrets.MCP_ZENDESK_MCP__ZENDESK_API_TOKEN }}
          SECRET_ZENDESK_EMAIL: ${{ secrets.MCP_ZENDESK_MCP__ZENDESK_EMAIL }}
          SECRET_ZENDESK_MCP_API_KEY: ${{ secrets.MCP_ZENDESK_MCP__ZENDESK_MCP_API_KEY }}
        run: python3 deploy/client.py
      - name: Deploy zendesk-browser-relay and verify
        if: matrix.service == 'zendesk-browser-relay'
        env:
          SECRET_CODEX_COMPLETION_API_KEY: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__CODEX_COMPLETION_API_KEY }}
          SECRET_CODEX_RUNNER_API_KEY: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__CODEX_RUNNER_API_KEY }}
          SECRET_DIFY_RESULT_WORKFLOW_API_KEY: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__DIFY_RESULT_WORKFLOW_API_KEY }}
          SECRET_RELAY_API_KEY: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__RELAY_API_KEY }}
          SECRET_ZENDESK_LOGIN_EMAIL: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__ZENDESK_LOGIN_EMAIL }}
          SECRET_ZENDESK_LOGIN_PASSWORD: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__ZENDESK_LOGIN_PASSWORD }}
          SECRET_ZENDESK_MCP_AUTHORIZATION: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__ZENDESK_MCP_AUTHORIZATION }}
          SECRET_ZENDESK_TOTP_SECRET: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__ZENDESK_TOTP_SECRET }}
          SECRET_FEISHU_NOTIFICATION_WEBHOOK_URL: ${{ secrets.MCP_ZENDESK_BROWSER_RELAY__FEISHU_NOTIFICATION_WEBHOOK_URL }}
        run: python3 deploy/client.py
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
