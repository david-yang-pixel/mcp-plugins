# Generated by python3 deploy/generate_workflow.py.
name: MCP CI and production deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to rebuild and deploy with current Secrets
        required: true
        type: string
        default: all

permissions:
  contents: read
concurrency:
  group: mcp-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      services: ${{ steps.select.outputs.services }}
      changed: ${{ steps.select.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/select_services.py

  verify-deployer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test deployment validation and rollback
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Install Nginx for isolated HTTPS integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y nginx
      - name: Exercise first deployment and rollback with real containers
        run: python3 deploy/tests/integration_docker.py
      - name: Check generated workflow is current
        run: |
          python3 deploy/generate_workflow.py
          git diff --exit-code -- .github/workflows/ci-cd.yml

  build:
    name: Build ${{ matrix.entry.service }}
    needs: [plan, verify-deployer]
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      SERVICE: ${{ matrix.entry.service }}
      IMAGE: ghcr.io/david-yang-pixel/mcp-plugins/${{ matrix.entry.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.10.7'
          python-version: '3.12'
          enable-cache: true
          cache-suffix: ${{ matrix.entry.service }}
      - name: Locked dependencies and service tests
        working-directory: ${{ matrix.entry.service }}
        run: |
          uv sync --locked --all-extras --all-groups
          uv run --locked pytest -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build image without production credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./${{ matrix.entry.service }}
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/david-yang-pixel/mcp-plugins
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.entry.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.entry.service }}
      - name: Verify packaged service and authentication
        run: python3 deploy/smoke_image.py "$SERVICE" "$IMAGE"
      - name: Publish private image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io

  deploy:
    name: Deploy ${{ matrix.entry.service }}
    needs: [plan, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.services) }}
    env:
      SERVICE: ${{ matrix.entry.service }}
      REVISION: ${{ github.sha }}
      DEPLOY_HOST: ${{ vars.MCP_DEPLOY_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.MCP_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ vars.MCP_DEPLOY_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY_TOKEN: ${{ github.token }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Authenticate to private image registry
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Deploy selected service and verify
        env:
          MCP_SECRET_0: ${{ secrets[matrix.entry.secret_names[0]] }}
          MCP_SECRET_1: ${{ secrets[matrix.entry.secret_names[1]] }}
          MCP_SECRET_2: ${{ secrets[matrix.entry.secret_names[2]] }}
          MCP_SECRET_3: ${{ secrets[matrix.entry.secret_names[3]] }}
          MCP_SECRET_4: ${{ secrets[matrix.entry.secret_names[4]] }}
          MCP_SECRET_5: ${{ secrets[matrix.entry.secret_names[5]] }}
          MCP_SECRET_6: ${{ secrets[matrix.entry.secret_names[6]] }}
          MCP_SECRET_7: ${{ secrets[matrix.entry.secret_names[7]] }}
          MCP_SECRET_8: ${{ secrets[matrix.entry.secret_names[8]] }}
          MCP_SECRET_9: ${{ secrets[matrix.entry.secret_names[9]] }}
          MCP_SECRET_10: ${{ secrets[matrix.entry.secret_names[10]] }}
          MCP_SECRET_11: ${{ secrets[matrix.entry.secret_names[11]] }}
          MCP_SECRET_12: ${{ secrets[matrix.entry.secret_names[12]] }}
          MCP_SECRET_13: ${{ secrets[matrix.entry.secret_names[13]] }}
          MCP_SECRET_14: ${{ secrets[matrix.entry.secret_names[14]] }}
          MCP_SECRET_15: ${{ secrets[matrix.entry.secret_names[15]] }}
          MCP_SECRET_16: ${{ secrets[matrix.entry.secret_names[16]] }}
          MCP_SECRET_17: ${{ secrets[matrix.entry.secret_names[17]] }}
          MCP_SECRET_18: ${{ secrets[matrix.entry.secret_names[18]] }}
          MCP_SECRET_19: ${{ secrets[matrix.entry.secret_names[19]] }}
          MCP_SECRET_20: ${{ secrets[matrix.entry.secret_names[20]] }}
          MCP_SECRET_21: ${{ secrets[matrix.entry.secret_names[21]] }}
          MCP_SECRET_22: ${{ secrets[matrix.entry.secret_names[22]] }}
          MCP_SECRET_23: ${{ secrets[matrix.entry.secret_names[23]] }}
          MCP_SECRET_24: ${{ secrets[matrix.entry.secret_names[24]] }}
          MCP_SECRET_25: ${{ secrets[matrix.entry.secret_names[25]] }}
          MCP_SECRET_26: ${{ secrets[matrix.entry.secret_names[26]] }}
          MCP_SECRET_27: ${{ secrets[matrix.entry.secret_names[27]] }}
          MCP_SECRET_28: ${{ secrets[matrix.entry.secret_names[28]] }}
          MCP_SECRET_29: ${{ secrets[matrix.entry.secret_names[29]] }}
          MCP_SECRET_30: ${{ secrets[matrix.entry.secret_names[30]] }}
          MCP_SECRET_31: ${{ secrets[matrix.entry.secret_names[31]] }}
        run: python3 deploy/client.py
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
