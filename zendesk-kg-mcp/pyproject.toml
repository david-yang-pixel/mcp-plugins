[project]
name = "zendesk-kg-mcp"
version = "0.1.0"
description = "Authenticated MCP access to the Zendesk historical-ticket knowledge base."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "pydantic-settings>=2.14,<3",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
zendesk-kg-mcp = "zendesk_kg_mcp.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
