[project]
name = "zendesk-mcp"
version = "0.1.0"
description = "Remote MCP service for guarded Zendesk ticket lookup and metadata/status updates."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "requests>=2.31",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
zendesk-mcp = "zendesk_mcp.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.20",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
    "uvicorn==0.53.0",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==17.1",
]
