resources:
  base_dir: ./data
postgres:
  host: 127.0.0.1
  port_prod: 56061
  port_billing: 56062
  port_plugin: 56063
  port_knowledgefs: 56064          # local tunnel run by db-gateway (teleport_tools.knowledgefs)
  # Step 2: a filled teleport_db_<db> moves that database from the host tunnel
  # (port_<db>) to a tunnel db-gateway runs itself on tunnel_port_<db>.
  teleport_db_prod: ""             # lg-pgsql-read-01
  teleport_db_billing: ""          # lg-billing-01
  teleport_db_plugin: ""           # lg-pgsql-read-01
  tunnel_port_prod: 56071
  tunnel_port_billing: 56072
  tunnel_port_plugin: 56073
  user: your-read-only-database-user
  db_prod: your-production-database
  db_billing: your-billing-database
  db_plugin: your-plugin-database
  db_knowledgefs: knowledgefs
  max_rows: 1000
  query_timeout_seconds: 30
  count_timeout_seconds: 5
  # psql: one psql process + new connection per query (~2s through Teleport).
  # pool: keep connections open in-process (psycopg pool); see README.
  driver: psql
  pool_min_size: 1
  pool_max_idle_seconds: 240
  pool_max_lifetime_seconds: 1800
  pool_check_idle_seconds: 60
  pool_acquire_timeout_seconds: 15
  pool_retry_delay_seconds: 1.5
  # Background keepalive (pool mode), see README.
  pool_keepalive_seconds: 30
  pool_probe_timeout_seconds: 5
  pool_maintenance_interval_seconds: 10
db_gateway:
  listen_host: 127.0.0.1
  listen_port: 18081
  # Audit log directory (file: db_gateway_audit.log). Empty/omitted:
  # <resources.base_dir>/<resources.state_dir>/logs
  audit_log_dir: ""
# db-gateway's own Teleport session (README "Teleport 会话"). Credentials come from
# TELEPORT_USER / TELEPORT_PASSWORD / TELEPORT_TOTP_SECRET; without them nothing logs in.
teleport:
  proxy: teleport.example.com:443
  tsh_path: /opt/teleport/bin/tsh
  sessions_dir: /tmp/db-gateway/tsh-sessions
  auto_renew: true
  renew_before_seconds: 480
  renew_retry_seconds: 30
  session_retain_seconds: 90
  max_auth_failures: 2
  login_timeout_seconds: 60
  notify_interval_seconds: 3600
  auth_home: ./.tsh                # host session; only for host-scoped manual logins
# Read-only Teleport tools (plugin_lambda_logs, kube_read) on that session.
teleport_tools:
  time_budget_seconds: 40   # whole tool call; keep below the 60s Nginx timeout
  max_concurrent: 3
  lambda_logs:
    enabled: true
    app: aws-support-logs
    aws_role: SupportLambdaLogsReadOnly
    region: us-east-1
    default_timezone: Asia/Shanghai
    default_limit: 1000
    max_limit: 10000
  kube:
    enabled: true
    clusters:
      prod: lg-eks-01
      staging: dify-plugin-1
    max_output_bytes: 1048576
  knowledgefs:
    enabled: true
    teleport_db: knowledge-fs-production-readonly
