resources:
  base_dir: ./data
postgres:
  host: 127.0.0.1
  port_prod: 56061
  port_billing: 56062
  port_plugin: 56063
  user: your-read-only-database-user
  db_prod: your-production-database
  db_billing: your-billing-database
  db_plugin: your-plugin-database
  max_rows: 1000
  query_timeout_seconds: 30
  count_timeout_seconds: 5
  # psql: one psql process + new connection per query (~2s through Teleport).
  # pool: keep connections open in-process (psycopg pool); see README.
  driver: psql
  pool_min_size: 1
  pool_max_idle_seconds: 240
  pool_max_lifetime_seconds: 1800
  pool_check_idle_seconds: 60
  pool_acquire_timeout_seconds: 15
  pool_retry_delay_seconds: 1.5
  pool_watch_teleport_keys: true
db_gateway:
  listen_host: 127.0.0.1
  listen_port: 18081
  # Audit log directory (file: db_gateway_audit.log). Empty/omitted:
  # <resources.base_dir>/<resources.state_dir>/logs
  audit_log_dir: ""
teleport:
  proxy: teleport.example.com:443
  auth_home: ./.tsh
# Read-only Teleport tools (plugin_lambda_logs, kube_read). They run the bundled
# tsh against a container-local copy of teleport.auth_home (shadow_home) and never
# write the shared one.
teleport_tools:
  tsh_path: /opt/teleport/bin/tsh
  shadow_home: /tmp/db-gateway/tsh-home
  time_budget_seconds: 40   # whole tool call; keep below the 60s Nginx timeout
  max_concurrent: 3
  lambda_logs:
    enabled: true
    app: aws-support-logs
    aws_role: SupportLambdaLogsReadOnly
    region: us-east-1
    default_timezone: Asia/Shanghai
    default_limit: 1000
    max_limit: 10000
  kube:
    enabled: true
    clusters:
      prod: lg-eks-01
      staging: dify-plugin-1
    max_output_bytes: 1048576
    kubeconfig_path: /tmp/db-gateway/kubeconfig
