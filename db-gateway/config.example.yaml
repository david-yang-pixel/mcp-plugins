resources:
  base_dir: ./data
postgres:
  host: 127.0.0.1
  port_prod: 56061
  port_billing: 56062
  port_plugin: 56063
  user: your-read-only-database-user
  db_prod: your-production-database
  db_billing: your-billing-database
  db_plugin: your-plugin-database
  max_rows: 1000
  query_timeout_seconds: 30
  count_timeout_seconds: 5
  # psql: one psql process + new connection per query (~2s through Teleport).
  # pool: keep connections open in-process (psycopg pool); see README.
  driver: psql
  pool_min_size: 1
  pool_max_idle_seconds: 240
  pool_max_lifetime_seconds: 1800
  pool_check_idle_seconds: 60
  pool_acquire_timeout_seconds: 15
  pool_retry_delay_seconds: 1.5
  pool_watch_teleport_keys: true
db_gateway:
  listen_host: 127.0.0.1
  listen_port: 18081
  # Audit log directory (file: db_gateway_audit.log). Empty/omitted:
  # <resources.base_dir>/<resources.state_dir>/logs
  audit_log_dir: ""
teleport:
  proxy: teleport.example.com:443
  auth_home: ./.tsh
