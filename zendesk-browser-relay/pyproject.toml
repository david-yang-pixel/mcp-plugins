[project]
name = "zendesk-browser-relay"
version = "0.2.0"
description = "HTTP relay that sends Zendesk Agent Workspace messaging replies through a persistent browser session."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.141.1",
    "playwright==1.60.0",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
zendesk-browser-relay = "zendesk_browser_relay.app:main"
zendesk-browser-login = "zendesk_browser_relay.login:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "click==8.5.0",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.19",
    "playwright==1.60.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pydantic_core==2.46.4",
    "pyee==13.0.1",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.52.4",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==17.1",
]
