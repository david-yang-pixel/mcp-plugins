[project]
name = "signoz-mcp"
version = "0.2.0"
description = "Read-only SigNoz MCP with structured diagnostics and a raw sz escape hatch."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.11,<2.14; python_version < '3.10'",
    "pydantic-settings>=2.14.2; python_version >= '3.10'",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
signoz-mcp = "signoz_mcp.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "click==8.4.2",
    "fastapi==0.140.13",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.18",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic_core==2.46.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "starlette==1.3.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.16.0",
    "uvicorn==0.51.0",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==16.1.1",
]
