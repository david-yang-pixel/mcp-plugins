[project]
name = "source-mcp"
version = "0.1.0"
description = "Remote MCP service for querying Dify SaaS source code at runtime refs."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "httpx2>=0.28",
    "pytest>=8.0",
]

[project.scripts]
source-mcp = "source_mcp.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "click==8.4.2",
    "fastapi==0.140.13",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.18",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic_core==2.46.4",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "starlette==1.3.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.16.0",
    "uvicorn==0.51.0",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==16.1.1",
]
